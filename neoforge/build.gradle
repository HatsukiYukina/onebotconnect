loom {
    mods {
        onebotconnect {
            sourceSet sourceSets.main
            sourceSet("main", project(':common'))
        }
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
}

configurations {
    commonBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // KotlinForForge 是独立的 mod，必须由玩家自行安装（见 neoforge.mods.toml 中的依赖声明）。
    // 不要使用 include 把它嵌套进本体 jar：其自带的 kotlinx.serialization / kotlin-stdlib
    // 会与玩家单独安装的 KotlinForForge 冲突。这里仅作为编译/开发运行期依赖。
    implementation "thedarkcolour:kotlinforforge-neoforge:$rootProject.kotlinforforge_version"

    // Cloth Config / Architectury 同样是独立 mod，仅编译期依赖，不打包。
    implementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    // 唯一需要随本体分发的普通库依赖（不是 mod），以 jar-in-jar 形式打包。
    include("org.java-websocket:Java-WebSocket:1.6.0") {
        transitive = false
    }

    implementation project(':common')

    commonBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) {
        transitive = false
    }
}

sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

jar {
    dependsOn project(':common').tasks.named('transformProductionNeoForge')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ configurations.commonBundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

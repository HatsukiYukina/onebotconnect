configurations {
    commonBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    implementation "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_language_kotlin_version"
    include "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_language_kotlin_version"

    implementation "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"

    include("org.java-websocket:Java-WebSocket:1.6.0") {
        transitive = false
    }

    implementation project(':common')

    commonBundle(project(path: ':common', configuration: 'transformProductionFabric')) {
        transitive = false
    }
}

sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

jar {
     dependsOn project(':common').tasks.named('transformProductionFabric')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ configurations.commonBundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}
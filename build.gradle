plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        mavenCentral()
        //ClothConfig
        maven { url "https://maven.shedaniel.me/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        //mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    //主入口清单
    tasks.named('jar') {
        manifest {
            from rootProject.file('common/src/main/resources/META-INF/MANIFEST.MF')
        }
    }

    //产物校验：除白名单内的普通库外，禁止把任何 mod 以 jar-in-jar 形式嵌套进产物
    //（KotlinForForge / Fabric Language Kotlin / Architectury / Cloth Config 等都必须由玩家单独安装）
    tasks.register('verifyNestedJars') {
        group = 'verification'
        description = '确保产物中只嵌套了白名单内的普通依赖库，不允许嵌套其他 mod'

        dependsOn tasks.named('jar')

        doLast {
            def jarFile = tasks.named('jar').get().archiveFile.get().asFile
            if (!jarFile.exists()) {
                return
            }

            def allowed = ['Java-WebSocket']
            def nested = []
            new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
                def entries = zf.entries()
                while (entries.hasMoreElements()) {
                    def name = entries.nextElement().name
                    if (name ==~ /META-INF\/jars\/.+\.jar/) {
                        nested << name
                    }
                }
            }

            def unexpected = nested.findAll { name -> !allowed.any { name.contains(it) } }
            if (!unexpected.isEmpty()) {
                throw new GradleException("${project.path}: 产物中只允许嵌套 ${allowed}，但发现了 ${unexpected}")
            }

            logger.lifecycle("${project.path}: 嵌套依赖校验通过 ${nested}")
        }
    }
    tasks.named('check') {
        dependsOn tasks.named('verifyNestedJars')
    }

    //避免重复条目
    tasks.withType(ProcessResources).configureEach {
        exclude 'META-INF/MANIFEST.MF'
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
